# Sized for the 1G container limit (see docker-compose.yml).
# Each MediaWiki apache worker uses ~50-70M resident, so worst-case
# worker RAM must stay well under 1024M minus baseline (~180M for the
# apache parent, PHP opcache, and mysql client). ~840M / ~55M ≈ 15 workers,
# so 16 is the safe ceiling. The stock default of 150 would fork past the
# cgroup limit and trigger an OOM-kill loop that takes the site down.
# Do NOT raise MaxRequestWorkers without also raising the container memory
# limit in docker-compose.yml.j2 accordingly (~55M of headroom per worker).
StartServers            3
MinSpareServers         3
MaxSpareServers         6
MaxRequestWorkers       16
MaxConnectionsPerChild  1000
