# Sized for the 512M container limit (see docker-compose.yml).
# Each MediaWiki apache worker uses ~50-70M resident, so worst-case
# worker RAM must stay well under 512M minus baseline (~180M for the
# apache parent, PHP opcache, and mysql client). ~330M / ~55M ≈ 6 workers,
# so 8 is the safe ceiling. The stock default of 150 (and the old 30 here)
# would fork past the cgroup limit and trigger the OOM-kill loop that took
# the site down. Do NOT raise MaxRequestWorkers without also raising the
# container memory limit accordingly.
StartServers            2
MinSpareServers         2
MaxSpareServers         4
MaxRequestWorkers       8
MaxConnectionsPerChild  1000
